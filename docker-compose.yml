services:
  postgres:
    image: postgres:16-alpine
    container_name: cyberstore_postgres
    restart: always

    env_file:
      - ./backend/.env

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5433:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cyberstore_redis
    restart: always

    ports:
      - "6380:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend

    container_name: cyberstore_backend
    restart: always

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: development

      DB_HOST: postgres
      REDIS_HOST: redis

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    ports:
      - "2000:2000"

    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:2000/api

    container_name: cyberstore_frontend
    restart: always

    depends_on:
      - backend

    ports:
      - "5173:5173"

volumes:
  pgdata:
  uploads: